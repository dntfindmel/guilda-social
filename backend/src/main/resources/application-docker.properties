# Server
server.port=8080
server.error.include-message=always

# Database - Usando variáveis de ambiente do Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:guilda_social}
spring.datasource.username=${DB_USER:guilda_user}
spring.datasource.password=${DB_PASSWORD:guilda_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:guildaSocialSecretKey2024SuperSecureForJWTTokenGenerationWithAtLeast512Bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.guildasocial=INFO
logging.level.org.springframework.web=WARN
