# application-docker.properties
spring.profiles.active=docker

# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Configuração para Docker (usando variáveis de ambiente)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:guilda_social}
spring.datasource.username=${DB_USER:guilda_user}
spring.datasource.password=${DB_PASSWORD:guilda_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.guildasocial=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.file.path=/app/logs
logging.file.name=/app/logs/application.log

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
