# backend/src/main/resources/application.properties

# Servidor
server.port=8080

# Database - Configuração para PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/guilda_social
spring.datasource.username=guilda_user
spring.datasource.password=guilda_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.com.guildasocial=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=guildaSocialSecretKey2024SuperSecureForJWTTokenGenerationWithAtLeast512Bits
jwt.expiration=86400000

