# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/guilda_social
spring.datasource.username=guilda_user
spring.datasource.password=guilda_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=guildaSocialSecretKey2024SuperSecureForJWTTokenGenerationWithAtLeast512Bits
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.guildasocial=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
