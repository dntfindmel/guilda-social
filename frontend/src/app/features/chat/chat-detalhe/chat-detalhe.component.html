<div class="chat-window">
  <div class="chat-header">
    <button [routerLink]="['/chat']">← Voltar</button>
    <h2>Chat</h2>
  </div>

  <div class="messages">
    <div *ngFor="let msg of mensagens" [class.me]="msg.remetenteId === remetenteId" class="message">
      <p>{{ msg.conteudo }}</p>
      <small>{{ msg.dataEnvio | date:'HH:mm' }}</small>
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      [(ngModel)]="novaMensagem"
      placeholder="Digite sua mensagem..."
      (keyup.enter)="enviar()">
    <button (click)="enviar()">Enviar</button>
  </div>
</div>
