<div class="editar-container">
  <app-header></app-header>

  <div class="editar-content">
    <div class="editar-card">
      <div class="header">
        <button class="btn-back" (click)="cancelar()">← Voltar</button>
        <h1>Editar Perfil</h1>
      </div>

      <div *ngIf="loading" class="loading-container">
        <div class="spinner"></div>
        <p>Carregando...</p>
      </div>

      <div *ngIf="!loading" class="form-container">
        <!-- Mensagens -->
        <div *ngIf="successMessage" class="success-message">
          ✅ {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="error-message">
          ❌ {{ errorMessage }}
        </div>

        <form [formGroup]="perfilForm" (ngSubmit)="salvar()">
          <div class="foto-section">
            <div class="foto-label">FOTO DE PERFIL</div>
            <div class="foto-container">
              <div class="foto-placeholder" (click)="fileInput.click()">
                <div class="avatar-preview" *ngIf="fotoPreview">
                  <img [src]="fotoPreview" alt="Foto de perfil">
                </div>
                <div class="avatar-placeholder" *ngIf="!fotoPreview">
                  <span class="camera-icon">📷</span>
                </div>
              </div>
              <input type="file" #fileInput (change)="onFotoSelecionada($event)" accept="image/*" style="display: none">
              <div class="foto-actions">
                <button type="button" class="btn-escolher" (click)="fileInput.click()">Escolher foto</button>
                <button type="button" class="btn-remover" (click)="removerFoto()" *ngIf="fotoPreview">Remover foto</button>
              </div>
            </div>
          </div>

          <div class="divider"></div>

          <!-- Informações Pessoais -->
          <h2>Informações Pessoais</h2>

          <div class="form-group">
            <label>Nome completo *</label>
            <input type="text" formControlName="nome" placeholder="Digite seu nome"
              [class.invalid]="perfilForm.get('nome')?.invalid && perfilForm.get('nome')?.touched">
            <div class="error" *ngIf="perfilForm.get('nome')?.invalid && perfilForm.get('nome')?.touched">
              Nome é obrigatório (mínimo 3 caracteres)
            </div>
          </div>

          <div class="form-group">
            <label>Telefone</label>
            <input
              type="tel"
              formControlName="telefone"
              placeholder="11999999999"
              inputmode="numeric"
              oninput="this.value = this.value.replace(/[^0-9]/g, '')"
              maxlength="11">
          </div>

          <div class="row">
            <div class="form-group col">
              <label>Cidade *</label>
              <input type="text" formControlName="cidade" placeholder="Sua cidade"
                [class.invalid]="perfilForm.get('cidade')?.invalid && perfilForm.get('cidade')?.touched">
            </div>
            <div class="form-group col">
              <label>Estado *</label>
              <select formControlName="estado"
                [class.invalid]="perfilForm.get('estado')?.invalid && perfilForm.get('estado')?.touched">
                <option value="">Selecione</option>
                <option *ngFor="let estado of estados" [value]="estado">{{ estado }}</option>
              </select>
            </div>
          </div>

          <div class="divider"></div>

          <!-- Sobre Você -->
          <h2>Sobre Você</h2>
          <div class="form-group">
            <textarea formControlName="descricao" rows="4"
              placeholder="Conte sobre suas histórias épicas e seus gostos pessoais"></textarea>
            <div class="contador" *ngIf="perfilForm.get('descricao')?.value">
              {{ perfilForm.get('descricao')?.value.length }}/500
            </div>
          </div>

          <!-- Botões -->
          <div class="form-actions">
            <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
            <button type="submit" class="btn-salvar" [disabled]="saving">
              <span *ngIf="!saving">💾 Salvar alterações</span>
              <span *ngIf="saving" class="loading-spinner"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
