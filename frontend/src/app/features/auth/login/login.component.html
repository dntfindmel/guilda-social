<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <h1>Guilda Social</h1>
      <p>Bem-vindo de volta!</p>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>E-mail</label>
        <input
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <div class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">E-mail é obrigatório</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">E-mail inválido</span>
        </div>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input
          type="password"
          formControlName="senha"
          placeholder="******"
          [class.invalid]="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched">
        <div class="error" *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched">
          <span *ngIf="loginForm.get('senha')?.errors?.['required']">Senha é obrigatória</span>
          <span *ngIf="loginForm.get('senha')?.errors?.['minlength']">Mínimo 6 caracteres</span>
        </div>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="!loading">Entrar</span>
        <span *ngIf="loading" class="loading-spinner"></span>
      </button>
    </form>

    <div class="register-link">
      Não tem uma conta? <a href="/cadastro">Criar conta</a>
    </div>
  </div>
</div>
