<header class="app-header">
  <div class="header-content">
    <div class="logo" (click)="irParaPerfil()">
      <h1>Guilda Social</h1>
    </div>
    <div class="header-actions">
      <div class="nav-icons">
        <button class="icon-btn-chat" (click)="irParaChat()" title="Conversas">
          💬
          <span class="badge" *ngIf="mensagensNaoLidas > 0">{{ mensagensNaoLidas }}</span>
        </button>
        <button class="icon-btn-perfil" (click)="irParaPerfil()" title="Meu Perfil">
          👤
        </button>
        <button class="icon-btn-logout" (click)="logout()" title="Sair">
          🚪
        </button>
      </div>
    </div>
  </div>
</header>
